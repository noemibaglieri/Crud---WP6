<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Backoffice</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <script src="assets/scripts/backoffice.js" defer></script>
  </head>
  <body>
    <div class="container mt-4">
      <h1>Admin Panel</h1>
      <div class="row mt-4">
        <div class="col-4">
          <form id="backoffice-form">
            <div class="mb-3">
              <label for="item-name" class="form-label fw-bold">Product Title</label>
              <input type="text" class="form-control" id="item-name" aria-describedby="item-name" placeholder="Insert title here..." required />
            </div>
            <div class="mb-3">
              <label for="item-description" class="form-label fw-bold">Product Description</label>
              <textarea
                class="form-control"
                id="item-description"
                aria-describedby="item-description"
                rows="3"
                placeholder="Insert description here..."
                required
              ></textarea>
            </div>
            <div class="mb-3">
              <label for="item-brand" class="form-label fw-bold">Product Brand</label>
              <input type="text" class="form-control" id="item-brand" aria-describedby="item-brand" placeholder="Insert brand here..." required />
            </div>
            <div class="mb-3">
              <label for="item-image" class="form-label fw-bold">Product Image</label>
              <input type="url" class="form-control" id="item-image" aria-describedby="item-image" placeholder="Insert image url here..." required />
            </div>
            <div class="mb-3">
              <label for="item-price" class="form-label fw-bold">Product Price</label>
              <input type="number" class="form-control" id="item-price" aria-describedby="item-pprice" placeholder="Insert price here..." step=".01" required />
            </div>
            <button type="submit" class="btn btn-success">Upload</button>
          </form>
        </div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
