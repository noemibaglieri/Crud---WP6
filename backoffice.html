<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Backoffice</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="icon" type="image" href="./assets/images/favicon.png" />
    <script src="assets/scripts/backoffice.js" defer></script>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="./index.html"><img id="website-logo" src="assets/images/Logo.png" alt="Logo" /></a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNavAltMarkup">
          <div class="navbar-nav">
            <a class="nav-link" aria-current="page" href="./index.html">Home</a>
            <a class="nav-link active fw-bold flo-primary-color" href="./backoffice.html">Backoffice</a>
          </div>
        </div>
      </div>
    </nav>
    <div class="container mt-4">
      <div class="d-flex align-items-center gap-3">
        <h1 class="display-5 d-inline-block">Admin Panel</h1>
        <h3 id="subtitle" class="d-inline-block p-2 rounded-3 fs-6 mb-0"></h3>
      </div>
      <div class="row mt-4">
        <div class="col-4">
          <form id="backoffice-form">
            <div class="mb-3">
              <label for="item-name" class="form-label fw-bold">Product Title</label>
              <input type="text" class="form-control" id="item-name" aria-describedby="item-name" placeholder="Insert title here..." required />
            </div>
            <div class="mb-3">
              <label for="item-description" class="form-label fw-bold">Product Description</label>
              <textarea
                class="form-control"
                id="item-description"
                aria-describedby="item-description"
                rows="3"
                placeholder="Insert description here..."
                required
              ></textarea>
            </div>
            <div class="mb-3">
              <label for="item-brand" class="form-label fw-bold">Product Brand</label>
              <input type="text" class="form-control" id="item-brand" aria-describedby="item-brand" placeholder="Insert brand here..." required />
            </div>
            <div class="mb-3">
              <label for="item-image" class="form-label fw-bold">Product Image</label>
              <input type="url" class="form-control" id="item-image" aria-describedby="item-image" placeholder="Insert image url here..." required />
            </div>
            <div class="mb-3">
              <label for="item-price" class="form-label fw-bold">Product Price</label>
              <input type="number" class="form-control" id="item-price" aria-describedby="item-pprice" placeholder="Insert price here..." step=".01" required />
            </div>
            <div class="d-flex justify-content-between">
              <button type="submit" class="btn btn-success" id="upload-button">Create new product</button>
              <button type="button" class="btn btn-danger d-none" id="delete-button"><i class="bi bi-trash3-fill"></i></button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <footer class="p-4 bg-body-tertiary fixed-bottom">
      <div class="container-fluid">
        <div class="container">
          <div class="row mt-4">
            <div class="col-md-3">
              <h5 class="flo-primary-color">Follow us</h5>
              <ul class="d-flex gap-2">
                <li>
                  <a href="#"><i class="bi bi-linkedin"></i></a>
                </li>
                <li>
                  <a href="#"><i class="bi bi-instagram"></i></a>
                </li>
                <li>
                  <a href="#"><i class="bi bi-twitter-x"></i></a>
                </li>
              </ul>
            </div>
            <div class="col-md-3">
              <h5 class="flo-primary-color">Floremie</h5>
              <ul>
                <li>16 The Green</li>
                <li>W5 5DA - London</li>
                <li>Company reg. n. 297087</li>
              </ul>
            </div>
            <div class="col-md-3">
              <h5 class="flo-primary-color">Payment methods</h5>
              <ul class="d-flex gap-2">
                <li><i class="bi bi-paypal"></i></li>
                <li><i class="bi bi-credit-card-2-back-fill"></i></li>
                <li><i class="bi bi-stripe"></i></li>
                <li><i class="bi bi-apple"></i></li>
                <li><i class="bi bi-google"></i></li>
              </ul>
            </div>
            <div class="col-md-3">
              <h5 class="flo-primary-color">Legal</h5>
              <ul>
                <li><a href="#">Privacy Policy</a></li>
                <li><a href="#">Shipment</a></li>
                <li><a href="#">FAQ</a></li>
                <li><a href="#">Work with us</a></li>
                <li><a href="#">Contacts</a></li>
              </ul>
            </div>
            <div class="col-md-12"><p>&copy; Noemi Baglieri, 2025 - All Rights Reserved</p></div>
          </div>
        </div>
      </div>
    </footer>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
